# Read by membership-migrate (deploy/compose.yml). Connection URL/username/
# password are NOT here — Liquibase's own ${VAR} substitution inside this
# file does not work (confirmed directly: it sends the literal string
# "${PG_ADMIN_USER}" to the driver instead of substituting). They're set
# instead via LIQUIBASE_COMMAND_URL/USERNAME/PASSWORD in compose.yml,
# Liquibase's documented env-var configuration mechanism — resolved from
# lms-infra-postgres's env/<environment>.env (rules/3-Anexo-J, J.5.1).
#
# Migrations run as the instance administrator — they create the membership
# schema and its objects, which the shared-instance admin must own; the
# running -api connects as membership_app instead (created by
# lms-infra-postgres's init script, granted membership_writer below in
# 03_dcl — never the admin).
#
# changeLogTableName/changeLogLockTableName: one shared database means two
# domains' migration-tracking tables would collide on the default name
# (rules/3-Anexo-J, J.6) — each domain's table is suffixed with its own name.
changelogFile=changelog/changelog-master.yaml
databaseChangeLogTableName=databasechangelog_membership
databaseChangeLogLockTableName=databasechangeloglock_membership
