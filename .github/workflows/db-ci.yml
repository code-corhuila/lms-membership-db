name: db-ci
on:
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lms_user
          POSTGRES_PASSWORD: lms_password
          POSTGRES_DB: membership_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms_user -d membership_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Liquibase update — build from empty
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}:/liquibase/changelog" -w /liquibase/changelog \
            liquibase/liquibase:4.29 \
            --changelog-file=changelog/changelog-master.yaml \
            --url=jdbc:postgresql://localhost:5432/membership_db \
            --username=lms_user --password=lms_password \
            update

      - name: Liquibase update again — must apply zero changesets
        run: |
          out=$(docker run --rm --network host \
            -v "${{ github.workspace }}:/liquibase/changelog" -w /liquibase/changelog \
            liquibase/liquibase:4.29 \
            --changelog-file=changelog/changelog-master.yaml \
            --url=jdbc:postgresql://localhost:5432/membership_db \
            --username=lms_user --password=lms_password \
            update)
          echo "$out"
          echo "$out" | grep -q "0 changesets have not been applied\|Run:  *0" || {
            echo "second update was not a no-op"; exit 1;
          }

      - name: Liquibase rollback — full teardown
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}:/liquibase/changelog" -w /liquibase/changelog \
            liquibase/liquibase:4.29 \
            --changelog-file=changelog/changelog-master.yaml \
            --url=jdbc:postgresql://localhost:5432/membership_db \
            --username=lms_user --password=lms_password \
            rollback-count 999

      - name: Liquibase update — rebuild after rollback
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}:/liquibase/changelog" -w /liquibase/changelog \
            liquibase/liquibase:4.29 \
            --changelog-file=changelog/changelog-master.yaml \
            --url=jdbc:postgresql://localhost:5432/membership_db \
            --username=lms_user --password=lms_password \
            update
